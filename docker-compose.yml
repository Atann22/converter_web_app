services:
  frontend:
    build:
      context: ./frontend
    container_name: converter_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
    container_name: converter_backend
    restart: unless-stopped
    ports:
      - "3000:3000"

  nginx:
    image: nginx:latest
    container_name: converter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend