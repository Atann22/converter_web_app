services:
  frontend:
    build:
      context: ./frontend
    container_name: converter_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy

  backend:
    build:
      context: ./backend
    container_name: converter_backend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - proxy

  nginx:
    image: nginx:latest
    container_name: converter_nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy

networks:
  proxy:
    external: true